{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="display-1 fw-bold text-danger">500</h1>
            <h2 class="mb-4">Internal Server Error</h2>
            <p class="lead text-muted mb-4">Something went wrong on our end. We are working to fix it.</p>
            <a href="{{ url_for('index') }}" class="btn btn-primary">Return Home</a>
            <a href="{{ url_for('login') }}" class="btn btn-outline-secondary ms-2">Login</a>
        </div>
    </div>
</div>
{% endblock %}
